name: Cache Windy Webcams

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:          # manual trigger

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Fetch Windy webcams (continental US)
        id: fetch
        run: |
          KEY="ttZyJ5dX6DjlG7EVDDvlh3PTKpKs1RsM"
          # Try gwcfc.net first, fall back to github.io if rejected
          STATUS=$(curl -s -o /tmp/windy_raw.json -w "%{http_code}" \
            -H "Origin: https://gwcfc.net" \
            -H "Referer: https://gwcfc.net/" \
            "https://api.windy.com/api/webcams/v3/webcams?key=${KEY}&bbox=24.0,-125.0,50.0,-66.0&limit=500&include=location,images,urls")
          echo "HTTP status (gwcfc.net): $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "gwcfc.net rejected, trying ralphhtml.github.io..."
            STATUS=$(curl -s -o /tmp/windy_raw.json -w "%{http_code}" \
              -H "Origin: https://ralphhtml.github.io" \
              -H "Referer: https://ralphhtml.github.io/GWCFCRadar/" \
              "https://api.windy.com/api/webcams/v3/webcams?key=${KEY}&bbox=24.0,-125.0,50.0,-66.0&limit=500&include=location,images,urls")
            echo "HTTP status (github.io): $STATUS"
          fi
          echo "Final status: $STATUS"
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "--- Response preview ---"
          cat /tmp/windy_raw.json | head -c 500

      - name: Validate and save
        if: steps.fetch.outputs.status == '200'
        run: |
          python3 - <<'EOF'
          import json, sys
          with open('/tmp/windy_raw.json') as f:
              d = json.load(f)
          cams = d.get('webcams', [])
          print(f"Got {len(cams)} webcams, total={d.get('total','?')}")
          slim = []
          for c in cams:
              loc = c.get('location', {})
              imgs = c.get('images', {}).get('current', {})
              slim.append({
                  'id': c.get('webcamId') or c.get('id'),
                  'title': c.get('title',''),
                  'lat': loc.get('latitude'),
                  'lon': loc.get('longitude'),
                  'city': loc.get('city',''),
                  'region': loc.get('region',''),
                  'country': loc.get('country',''),
                  'thumb': imgs.get('thumbnail','') or imgs.get('preview',''),
                  'preview': imgs.get('preview',''),
                  'detail': (c.get('urls') or {}).get('detail',''),
              })
          out = {'webcams': slim, 'total': len(slim), 'cached_at': __import__('datetime').datetime.utcnow().isoformat()+'Z'}
          with open('windy-webcams.json', 'w') as f:
              json.dump(out, f, separators=(',',':'))
          print(f"Wrote {len(slim)} webcams to windy-webcams.json")
          EOF

      - name: Commit cache
        if: steps.fetch.outputs.status == '200'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add windy-webcams.json
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "chore: update Windy webcam cache [skip ci]" && git push
