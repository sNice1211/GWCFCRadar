name: Discord chat bridge

# Carries messages from the Discord channel onto the radar's Live Chat.
#
# Messages going the other way (radar -> Discord) do not use this at all: the
# website posts those straight to the webhook and they arrive instantly. This
# is only the return direction, which a webhook cannot do - a webhook can post
# into a channel but Discord gives it no way to read one.
#
# Five minutes is the shortest schedule GitHub offers, and busy periods delay
# it further, so expect a Discord message to appear on the map within about
# five minutes. For ~1 minute instead, deploy chat-bridge/ to Cloudflare
# (see chat-bridge/README.md) - same code, faster timer.

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:          # run it now, from the Actions tab

# Nothing here writes to the repo.
permissions:
  contents: read

# Never let two runs poll at once: both would read the same cursor and relay
# the same messages twice.
concurrency:
  group: discord-chat-bridge
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Not being set up and being broken are different things, and only one of
      # them is worth a red run. This fires every five minutes, so when the
      # secrets are absent it was posting roughly 288 failures a day: enough to
      # bury a real fault and to spend Actions minutes proving the same point
      # over and over. Missing configuration now ends the run quietly with a
      # notice saying what to add. A genuine relay failure still exits non-zero
      # from poll.mjs and still shows up red.
      - name: Relay new Discord messages to the radar
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          CHAT_CHANNEL_ID: ${{ secrets.CHAT_CHANNEL_ID }}
        run: |
          if [ -z "${DISCORD_TOKEN:-}" ] || [ -z "${CHAT_CHANNEL_ID:-}" ]; then
            echo "::notice title=Discord bridge not configured::Set DISCORD_TOKEN and CHAT_CHANNEL_ID under Settings, Secrets and variables, Actions. Until then the Discord to radar direction stays off. Radar to Discord is unaffected: it posts straight to the webhook."
            exit 0
          fi
          node chat-bridge/poll.mjs
