<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512" role="img" aria-label="NWRchive">
  <title>NWRchive</title>
  <defs>
    <!-- The folder. Brightest along the top lip where a light would catch it,
         deepening toward the bottom, so the shape reads as an object with a
         front face rather than a flat silhouette. -->
    <linearGradient id="nwr-folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFE885"/>
      <stop offset="0.42" stop-color="#F5D24A"/>
      <stop offset="1"    stop-color="#DCA81C"/>
    </linearGradient>
    <!-- The radio face, lit the same way but a shorter throw, since it is a
         recessed panel and a recess catches less light than the lip above it. -->
    <linearGradient id="nwr-face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#DB3A2C"/>
      <stop offset="0.55" stop-color="#C0201C"/>
      <stop offset="1"    stop-color="#8F140F"/>
    </linearGradient>
    <!-- Everything gold sitting ON the red: dial, grille, aerial. Warmer and
         lighter than the folder so it separates from it rather than blending. -->
    <linearGradient id="nwr-trim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#FFEFA8"/>
      <stop offset="0.55" stop-color="#F7D64E"/>
      <stop offset="1"    stop-color="#E6B92C"/>
    </linearGradient>
    <linearGradient id="nwr-air" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#FFEFA8"/>
      <stop offset="1"    stop-color="#EFC63A"/>
    </linearGradient>
  </defs>

  <!-- Broadcast, drawn first so the folder covers anything that reaches it. -->
  <g fill="none" stroke="url(#nwr-air)" stroke-width="1.5" stroke-linecap="round">
    <path d="M34.9 4.6A4.5 4.5 0 0 1 34.9 11.4"/>
    <path d="M28.1 11.4A4.5 4.5 0 0 1 28.1 4.6"/>
    <path d="M36.8 2.3A7.5 7.5 0 0 1 36.8 13.7"/>
    <path d="M26.2 13.7A7.5 7.5 0 0 1 26.2 2.3"/>
    <path d="M38.8 0.0A10.5 10.5 0 0 1 38.8 16.0"/>
    <path d="M24.2 16.0A10.5 10.5 0 0 1 24.2 0.0"/>
  </g>
  <!-- Aerial: a thin rod, deliberately not a thick one, because the folder
       below it is all mass and the mark needs somewhere to breathe. -->
  <path d="M18 27 30.6 9.4" fill="none" stroke="url(#nwr-air)"
        stroke-width="1.6" stroke-linecap="round"/>
  <circle cx="31" cy="8" r="2.2" fill="url(#nwr-trim)"/>

  <!-- Folder -->
  <path d="M10 16h20a5 5 0 0 1 4.2 2.3L37 23h17a6 6 0 0 1 6 6v25a6 6 0 0 1-6 6H10a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6z"
        fill="url(#nwr-folder)"/>
  <!-- The side knob, which is what makes it read as a set rather than a box -->
  <rect x="54.5" y="36" width="4" height="9" rx="1.8" fill="url(#nwr-face)"/>
  <!-- The radio face -->
  <rect x="8" y="28" width="48" height="26" rx="4.5" fill="url(#nwr-face)"/>

  <!-- Speaker, left -->
  <circle cx="22" cy="41" r="9.4" fill="none" stroke="url(#nwr-trim)" stroke-width="3.2"/>
  <!-- Tuning grille, right -->
  <g fill="url(#nwr-trim)">
    <rect x="36" y="31.6" width="15.5" height="3.3" rx="1.65"/>
    <rect x="36" y="36.6" width="15.5" height="3.3" rx="1.65"/>
    <rect x="36" y="41.6" width="15.5" height="3.3" rx="1.65"/>
    <rect x="36" y="46.6" width="15.5" height="3.3" rx="1.65"/>
  </g>
</svg>
