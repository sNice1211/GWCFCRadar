name = "gwcfcradar-discord-auth"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
# Public. The Client ID appears in every invite link; it is not a secret.
DISCORD_CLIENT_ID = "1499924805833723944"

# Where the visitor may be sent back to after logging in, comma separated.
# This is the allow-list that stops someone crafting a login link that hands
# their session token to a site you do not control. Add your real domain here
# when the site moves.
ALLOWED_ORIGINS = "https://ralphhtml.github.io,http://localhost:8009"

# Must match a redirect URI registered on the Discord application exactly.
OAUTH_REDIRECT_URI = "https://gwcfcradar-discord-auth.ralphies1005.workers.dev/callback"

# Set these three with `wrangler secret put` - never in this file, which is
# committed to a public repo:
#   wrangler secret put DISCORD_CLIENT_SECRET
#   wrangler secret put FIREBASE_CLIENT_EMAIL
#   wrangler secret put FIREBASE_PRIVATE_KEY
