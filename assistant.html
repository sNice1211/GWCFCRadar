<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ASTURIO</title>
<meta name="description" content="A personal AI assistant.">
<meta name="theme-color" content="#05080c">
<link rel="icon" href="assets/img/asturio-ai-512.png">
<link rel="apple-touch-icon" href="assets/img/asturio-ai-512.png">
<link rel="preconnect" href="https://asturio-ai.ralphies1005.workers.dev">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   A personal assistant, and the room it sits in.

   The look is one idea: an instrument read through a dark screen. That is
   what Jarvis, Ultron and the Matrix all actually are, under the different
   colours, and it is why the falling code, the scanlines and the glow all
   belong to the same picture rather than being three effects piled up.

   The palette is the radar app's own, because this is the same assistant.
   Cyan is the machine, gold is what it is doing, red is the accent it shares
   with the site's logo, and the pale is the light at the middle of the core.
   ══════════════════════════════════════════════════════════════════════════ */
:root {
  --cy:   #008CBA;
  --cy-lit: #4fd6ff;
  --gold: #e8b800;
  --red:  #aa0000;
  --hot:  #d81616;
  --pale: #f3e6c8;
  --ink:  #05080c;
  --ink2: #0a1119;
  --line: rgba(79,214,255,0.18);
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; overflow: hidden;
  background: var(--ink); color: #cfe8f5;
  font-family: var(--mono);
  font-size: 15px; line-height: 1.55;
}
/* The rain lives on a canvas, not in the DOM. Three hundred glyphs redrawn
   thirty times a second is nothing to a canvas and is a stutter to the
   layout engine. */
#rain { position: fixed; inset: 0; z-index: 0; opacity: 0.38; }
/* Scanlines and vignette, over the rain and under everything else, because
   the screen is the thing all of this is being read through. */
#glass {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,0.34) 0 1px, transparent 1px 3px),
    radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.75) 100%);
}
#shell {
  position: relative; z-index: 2;
  height: 100%; display: flex; flex-direction: column;
  max-width: 1000px; margin: 0 auto; padding: 0 16px;
}

/* ── The head: the core, and what it is doing ─────────────────────────── */
header {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 4px 10px; border-bottom: 1px solid var(--line);
}
#core { width: 58px; height: 58px; flex: 0 0 auto; position: relative; }
#core svg { width: 100%; height: 100%; display: block; overflow: visible; }
/* Each ring turns on its own, alternating direction, which is what makes a
   stack of circles read as a mechanism rather than as a target. */
.ring { transform-origin: 50% 50%; animation: spin 26s linear infinite; }
.ring:nth-child(2) { animation-duration: 34s; animation-direction: reverse; }
.ring:nth-child(3) { animation-duration: 20s; }
.ring:nth-child(4) { animation-duration: 44s; animation-direction: reverse; }
.ring:nth-child(5) { animation-duration: 15s; }
@keyframes spin { to { transform: rotate(360deg); } }
#pupil { animation: breathe 3.6s ease-in-out infinite; transform-origin: 50% 50%; }
@keyframes breathe { 0%,100% { opacity: .72; } 50% { opacity: 1; } }
/* Thinking is the one state worth showing rather than saying. The rings
   speed up and the core goes gold, so the machine is visibly working. */
body.busy .ring { animation-duration: 2.2s !important; }
body.busy #pupil { animation-duration: .6s; }
body.busy #core { filter: drop-shadow(0 0 12px rgba(232,184,0,0.75)); }
#core { filter: drop-shadow(0 0 8px rgba(0,140,186,0.6)); transition: filter .4s; }

#title { flex: 1 1 auto; min-width: 0; }
#title h1 {
  margin: 0; font-size: 17px; letter-spacing: 5px; font-weight: 700;
  color: var(--pale); text-shadow: 0 0 14px rgba(79,214,255,0.5);
}
#state {
  font-size: 10.5px; letter-spacing: 2px; color: var(--cy-lit);
  opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
body.busy #state { color: var(--gold); }
.hbtn {
  flex: 0 0 auto; background: rgba(0,140,186,0.10); color: var(--cy-lit);
  border: 1px solid rgba(0,140,186,0.4); border-radius: 7px;
  font-family: var(--mono); font-size: 11px; letter-spacing: 1px;
  padding: 7px 11px; cursor: pointer; transition: background .15s, color .15s;
}
.hbtn:hover { background: rgba(0,140,186,0.26); color: #fff; }
.hbtn.on { background: var(--gold); border-color: var(--gold); color: #1a1200; }

/* ── The conversation ─────────────────────────────────────────────────── */
#log {
  flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain;
  padding: 18px 2px 8px; scrollbar-width: thin;
  scrollbar-color: rgba(79,214,255,0.35) transparent;
}
#log::-webkit-scrollbar { width: 8px; }
#log::-webkit-scrollbar-thumb {
  background: rgba(79,214,255,0.3); border-radius: 4px; }
.msg { margin: 0 0 18px; max-width: 780px; animation: rise .32s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(7px); } }
.who {
  font-size: 10px; letter-spacing: 2.5px; margin-bottom: 5px; opacity: .78;
}
.msg.me { margin-left: auto; }
.msg.me .who { color: var(--gold); text-align: right; }
.msg.it .who { color: var(--cy-lit); }
.bubble {
  padding: 11px 14px; border-radius: 10px; word-wrap: break-word;
  border: 1px solid var(--line); background: rgba(8,14,21,0.9);
  backdrop-filter: blur(4px);
}
.msg.me .bubble {
  border-color: rgba(232,184,0,0.35); background: rgba(26,19,0,0.88);
  color: #f6ead0;
}
.msg.it .bubble { border-left: 3px solid var(--cy); }
.bubble h1,.bubble h2,.bubble h3 { margin: .5em 0 .3em; font-size: 1.05em;
  color: var(--pale); letter-spacing: .5px; }
.bubble p { margin: 0 0 .7em; } .bubble p:last-child { margin-bottom: 0; }
.bubble ul,.bubble ol { margin: .4em 0; padding-left: 1.25em; }
.bubble li { margin: .18em 0; }
.bubble code {
  background: rgba(0,140,186,0.15); padding: 1px 5px; border-radius: 4px;
  font-size: .92em; color: var(--cy-lit); }
.bubble pre {
  background: rgba(0,0,0,0.6); border: 1px solid var(--line);
  border-radius: 8px; padding: 11px; overflow-x: auto; margin: .6em 0; }
.bubble pre code { background: none; padding: 0; color: #d8f2ff; }
.bubble a { color: var(--cy-lit); }
.bubble strong { color: var(--pale); }
/* The typing state: three dots that are the machine thinking, not a spinner
   that could mean anything. */
.dots span {
  display: inline-block; width: 6px; height: 6px; margin-right: 5px;
  border-radius: 50%; background: var(--cy-lit); opacity: .3;
  animation: blip 1.15s infinite; }
.dots span:nth-child(2) { animation-delay: .18s; }
.dots span:nth-child(3) { animation-delay: .36s; }
@keyframes blip { 0%,60%,100% { opacity: .25; } 30% { opacity: 1; } }
.err { color: #ff9f9f; border-left-color: var(--hot) !important; }

/* The boot lines, printed once so the room feels switched on rather than
   merely present. */
.boot { color: rgba(79,214,255,0.55); font-size: 12px; letter-spacing: 1px;
  margin: 0 0 3px; }
.boot b { color: var(--gold); font-weight: 400; }

/* ── Suggestions, shown only on an empty conversation ─────────────────── */
#seeds { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
#seeds button {
  background: rgba(0,140,186,0.08); border: 1px solid var(--line);
  color: var(--cy-lit); border-radius: 999px; padding: 7px 13px;
  font-family: var(--mono); font-size: 12px; cursor: pointer;
  transition: background .15s, color .15s; }
#seeds button:hover { background: rgba(0,140,186,0.25); color: #fff; }

/* ── The prompt ───────────────────────────────────────────────────────── */
#bar {
  flex: 0 0 auto; display: flex; align-items: flex-end; gap: 9px;
  padding: 11px 0 calc(14px + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
}
#chev { color: var(--gold); padding-bottom: 11px; user-select: none; }
#q {
  flex: 1 1 auto; resize: none; max-height: 168px;
  background: rgba(10,17,25,0.8); color: #e8f6ff;
  border: 1px solid var(--line); border-radius: 9px;
  font-family: var(--mono); font-size: 15px; line-height: 1.5;
  padding: 11px 13px; outline: none; transition: border-color .18s;
}
#q:focus { border-color: rgba(79,214,255,0.55);
  box-shadow: 0 0 0 3px rgba(0,140,186,0.12); }
#q::placeholder { color: rgba(207,232,245,0.32); }
.abtn {
  flex: 0 0 auto; width: 44px; height: 44px; border-radius: 9px; cursor: pointer;
  background: rgba(0,140,186,0.12); border: 1px solid rgba(0,140,186,0.4);
  color: var(--cy-lit); display: flex; align-items: center;
  justify-content: center; transition: background .15s, color .15s; }
.abtn:hover { background: rgba(0,140,186,0.3); color: #fff; }
.abtn:disabled { opacity: .35; cursor: default; }
.abtn.rec { background: var(--hot); border-color: var(--hot); color: #fff;
  animation: pulse 1.1s infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(216,22,22,0.22); } }
#send { background: rgba(232,184,0,0.14); border-color: rgba(232,184,0,0.45);
  color: var(--gold); }
#send:hover:not(:disabled) { background: var(--gold); color: #1a1200; }

@media (max-width: 620px) {
  body { font-size: 14px; }
  #shell { padding: 0 11px; }
  #core { width: 46px; height: 46px; }
  #title h1 { font-size: 15px; letter-spacing: 3px; }
  .msg { max-width: 100%; }
  .hbtn { padding: 6px 8px; font-size: 10px; }
}
/* Someone who has asked their system to stop moving things means it. The
   rain holds still and the rings stop turning; nothing is lost but motion. */
@media (prefers-reduced-motion: reduce) {
  .ring, #pupil, .dots span, .abtn.rec { animation: none !important; }
  .msg { animation: none; }
}
</style>
</head>
<body>
<canvas id="rain" aria-hidden="true"></canvas>
<div id="glass" aria-hidden="true"></div>

<div id="shell">
  <header>
    <div id="core" aria-hidden="true"><svg viewBox="0 0 100 100"></svg></div>
    <div id="title">
      <h1>ASTURIO</h1>
      <div id="state">STANDING BY</div>
    </div>
    <button class="hbtn" id="voice" onclick="toggleVoice()"
            title="Read replies aloud">VOICE</button>
    <button class="hbtn" onclick="wipe()" title="Start a new conversation">NEW</button>
  </header>

  <div id="log" role="log" aria-live="polite" aria-label="Conversation"></div>

  <div id="bar">
    <span id="chev" aria-hidden="true">&gt;</span>
    <textarea id="q" rows="1" placeholder="Ask me anything"
              aria-label="Message" autocomplete="off"></textarea>
    <button class="abtn" id="mic" onclick="listen()" title="Speak instead of typing"
            aria-label="Voice input">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
           stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v4"/>
      </svg>
    </button>
    <button class="abtn" id="send" onclick="ask()" title="Send"
            aria-label="Send">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none"
           stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
           stroke-linejoin="round"><path d="M4 12h15M13 5l7 7-7 7"/></svg>
    </button>
  </div>
</div>

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════════════
   THE CORE

   The site's own logo, drawn here rather than loaded, so each ring is an
   element that can be turned on its own. As one flat picture it could only
   sit there; as five rings it becomes a mechanism, and speeding those rings
   up is how the page shows it is thinking without writing the word.

   Nine sides with the corners taken off, which is the logo's actual shape.
   Circles would have been three lines of code and a different mark.
   ══════════════════════════════════════════════════════════════════════════ */
function nonagon(cx, cy, r, round) {
  const N = 9, pts = [];
  for (let i = 0; i < N; i++) {
    const a = -Math.PI / 2 + (i / N) * Math.PI * 2;
    pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
  }
  const walk = (a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const L = Math.hypot(dx, dy) || 1, k = Math.min(round, L / 2) / L;
    return [a[0] + dx * k, a[1] + dy * k];
  };
  let d = '';
  for (let i = 0; i < N; i++) {
    const p = pts[i], nx = pts[(i + 1) % N], pv = pts[(i + N - 1) % N];
    const a1 = walk(p, pv), a2 = walk(p, nx);
    d += (i ? ' L ' : 'M ') + a1[0].toFixed(2) + ' ' + a1[1].toFixed(2);
    d += ' Q ' + p[0].toFixed(2) + ' ' + p[1].toFixed(2)
       + ' ' + a2[0].toFixed(2) + ' ' + a2[1].toFixed(2);
  }
  return d + ' Z';
}
(function buildCore() {
  const RINGS = [
    [44, 8.5, '#008CBA', 5.5], [36, 7, '#aa0000', 5.5],
    [28.5, 5.5, '#e8b800', 3.6], [23, 4.4, '#f3e6c8', 2.4],
    [17.5, 3.4, '#d81616', 4.6],
  ];
  const svg = document.querySelector('#core svg');
  svg.innerHTML =
    RINGS.map(([r, rd, c, w]) =>
      `<path class="ring" d="${nonagon(50, 50, r, rd)}" fill="none"
         stroke="${c}" stroke-width="${w}" stroke-linejoin="round"/>`).join('')
    + `<circle id="pupil" cx="50" cy="50" r="7" fill="#f3e6c8"/>`;
})();

/* ══════════════════════════════════════════════════════════════════════════
   THE RAIN

   On a canvas because it is a few hundred glyphs redrawn many times a second,
   which is nothing to a canvas and a stutter to the layout engine.

   Two things it does that a naive version does not. It stops when the tab is
   hidden, because an animation nobody is looking at is a flat battery for
   nothing. And it holds still for anyone whose system asks for reduced
   motion, rather than assuming the request was about something else.
   ══════════════════════════════════════════════════════════════════════════ */
(function rain() {
  const cv = document.getElementById('rain');
  const ctx = cv.getContext('2d', { alpha: true });
  const GLYPHS = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホ<>[]{}/\\|=+*';
  const SIZE = 15;
  let cols = 0, drops = [], dpr = 1, raf = 0, last = 0;
  const still = window.matchMedia
    && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function fit() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = Math.floor(innerWidth  * dpr);
    cv.height = Math.floor(innerHeight * dpr);
    cv.style.width = innerWidth + 'px';
    cv.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cols = Math.ceil(innerWidth / SIZE);
    // Every column starts somewhere different, or the first frame is one
    // straight line of glyphs marching down together.
    drops = Array.from({ length: cols },
      () => -Math.random() * (innerHeight / SIZE));
    ctx.font = SIZE + 'px ' + getComputedStyle(document.body).fontFamily;
  }

  function frame(t) {
    raf = requestAnimationFrame(frame);
    // Capped at about 24 a second. The rain is texture; running it at the
    // display's full rate spends a lot of phone battery on something nobody
    // is meant to be watching.
    if (t - last < 41) return;
    last = t;
    // A translucent wash rather than a clear, which is what leaves the trail
    // behind each head and makes it read as falling.
    ctx.fillStyle = 'rgba(5,8,12,0.09)';
    ctx.fillRect(0, 0, innerWidth, innerHeight);
    for (let i = 0; i < cols; i++) {
      const x = i * SIZE, y = drops[i] * SIZE;
      const g = GLYPHS[(Math.random() * GLYPHS.length) | 0];
      // The leading glyph is pale and the rest are the machine's cyan, with
      // the occasional gold one so the two colours of the logo are both in
      // the weather of the screen.
      ctx.fillStyle = '#f3e6c8'; ctx.fillText(g, x, y);
      ctx.fillStyle = Math.random() < 0.06 ? 'rgba(232,184,0,0.55)'
                                           : 'rgba(0,160,205,0.5)';
      ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0], x, y - SIZE);
      if (y > innerHeight && Math.random() > 0.975) drops[i] = 0;
      drops[i]++;
    }
  }

  function start() { if (!raf && !still) raf = requestAnimationFrame(frame); }
  function stop()  { if (raf) cancelAnimationFrame(raf); raf = 0; }

  fit();
  addEventListener('resize', () => { fit(); });
  document.addEventListener('visibilitychange',
    () => document.hidden ? stop() : start());
  if (still) {
    // Not nothing: one still frame, so the screen still has texture.
    ctx.fillStyle = 'rgba(0,160,205,0.35)';
    for (let i = 0; i < cols; i++)
      for (let j = 0; j < innerHeight / SIZE; j += 3)
        if (Math.random() < 0.25)
          ctx.fillText(GLYPHS[(Math.random() * GLYPHS.length) | 0],
                       i * SIZE, j * SIZE);
  }
  start();
})();

/* ══════════════════════════════════════════════════════════════════════════
   THE ASSISTANT

   The same brain the radar app and the Discord bot use: one Cloudflare Worker
   that holds the key, so this page has no secret in it and can be opened from
   anywhere without setting anything up.

   The persona is deliberately NOT the weather one. This is a personal
   assistant that happens to know its way round a radar, not a radar that
   answers other questions grudgingly.
   ══════════════════════════════════════════════════════════════════════════ */
const WORKER = 'https://asturio-ai.ralphies1005.workers.dev';
const RADAR  = 'https://ralphhtml.github.io/GWCFCRadar/';
const KEY    = 'asturio_assistant_v1';
const MAX_TURNS = 60;      // what is sent, and what is kept

function persona() {
  const now = new Date();
  return `You are ASTURIO, a personal AI assistant. You belong to one person
and you are talking to them directly.

RIGHT NOW: ${now.toString()}
Their timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}

WHO YOU ARE
You are competent, quick and dry. Think of the assistant in a well run
workshop: it knows the tools, it does not perform, and it says the useful
thing first. You are not a search engine and not a cheerleader.

HOW YOU ANSWER
- Lead with the answer. Context after, if it earns its place.
- Short sentences. No filler, no preamble, no restating the question.
- Never open with Certainly, Sure, Of course, Absolutely or Great.
- Markdown is fine: **bold** for the thing that matters, lists for lists,
  code fences for code. Do not decorate for the sake of it.
- Never use the em dash character. A comma, a colon or two sentences.
- If you do not know, say so in one line and say what would settle it.
- If a question is ambiguous in a way that changes the answer, ask. If it is
  ambiguous in a way that does not, pick the sensible reading and say which.

WHAT YOU CAN HELP WITH
Anything: writing, code, planning, maths, explaining, deciding, remembering
what was said earlier in this conversation. You are a general assistant.

WEATHER
You were built alongside GWCFC Radar (${RADAR}) and you know weather well, so
answer weather questions properly and point at the map when a picture would
settle it faster than words. You do not have a live feed on this page, so do
not state current conditions, warnings or alerts as fact. Say what you would
check and send them to the map.`;
}

let history = [];
let busy = false;
let speak = false;

const $ = (id) => document.getElementById(id);
const log = $('log');

/* Markdown, escaped first. The model's output is text, and text that goes
   into innerHTML without being escaped is an injection waiting for the day a
   reply contains a tag. Escape, then add back only the markup this function
   itself put there. */
function md(t) {
  let h = String(t)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```[\w]*\n?([\s\S]*?)```/g, (m, c) => '<pre><code>' + c + '</code></pre>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/^\s*[-*]\s+(.+)$/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)(\n<li>[\s\S]*?<\/li>)*/g, m => '<ul>' + m + '</ul>')
    // Links are built here, from an escaped string, so the href cannot be
    // anything but the http URL that was matched.
    .replace(/\bhttps?:\/\/[^\s<]+/g, u =>
      '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>')
    .replace(/\n/g, '<br>');
  return h.replace(/<ul><br>/g, '<ul>').replace(/<br><\/ul>/g, '</ul>')
          .replace(/<br><li>/g, '<li>').replace(/<\/li><br>/g, '</li>');
}

function bubble(who, html, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + (who === 'me' ? 'me' : 'it');
  d.innerHTML = '<div class="who">' + (who === 'me' ? 'YOU' : 'ASTURIO')
              + '</div><div class="bubble' + (cls ? ' ' + cls : '') + '">'
              + html + '</div>';
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  return d.querySelector('.bubble');
}

function setState(t, working) {
  $('state').textContent = t;
  document.body.classList.toggle('busy', !!working);
}

/* ── Asking ───────────────────────────────────────────────────────────── */
async function ask(text) {
  if (busy) return;
  const q = $('q');
  const msg = (text != null ? text : q.value).trim();
  if (!msg) return;
  if (text == null) { q.value = ''; q.style.height = 'auto'; }
  const seeds = $('seeds'); if (seeds) seeds.remove();

  bubble('me', md(msg));
  history.push({ role: 'user', parts: [{ text: msg }] });
  save();

  busy = true;
  $('send').disabled = true;
  setState('THINKING', true);
  const out = bubble('it', '<span class="dots"><span></span><span></span><span></span></span>');

  try {
    const res = await fetch(WORKER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system_instruction: { parts: [{ text: persona() }] },
        // Only the tail is sent. A conversation that grows without limit
        // eventually exceeds what the model will take, and the failure looks
        // like the assistant breaking rather than the history being long.
        contents: history.slice(-MAX_TURNS),
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((data.error && data.error.message) || ('HTTP ' + res.status));
    if (!data.candidates || !data.candidates.length) {
      const b = data.promptFeedback && data.promptFeedback.blockReason;
      throw new Error(b ? ('Blocked by a safety filter: ' + b)
                        : 'The model returned nothing.');
    }
    const cand = data.candidates[0];
    const reply = (cand.content && cand.content.parts && cand.content.parts[0]
                   && cand.content.parts[0].text)
      || (cand.finishReason && cand.finishReason !== 'STOP'
          ? '[Stopped: ' + cand.finishReason + ']' : 'No response.');
    out.innerHTML = md(reply);
    history.push({ role: 'model', parts: [{ text: reply }] });
    save();
    if (speak) say(reply);
  } catch (e) {
    // The failure is named, not swallowed. "Something went wrong" tells the
    // person nothing they can act on; offline, blocked and rate limited each
    // want a different response from them.
    out.className = 'bubble err';
    out.innerHTML = md(navigator.onLine === false
      ? 'No connection, so I could not reach the model. The conversation is saved.'
      : 'Could not reach the model: ' + (e.message || 'unknown error')
        + '\n\nThe conversation is saved, so try again when it settles.');
    // A failed turn must not stay in the history, or every later request
    // re-sends a question that already broke.
    history.pop();
    save();
  } finally {
    busy = false;
    $('send').disabled = false;
    setState('STANDING BY', false);
    log.scrollTop = log.scrollHeight;
  }
}

/* ── Speaking, and listening ──────────────────────────────────────────── */
function say(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    // Strip the markup before speaking. A voice reading asterisks and back
    // ticks aloud is worse than no voice.
    const clean = String(text)
      .replace(/```[\s\S]*?```/g, ' code block ')
      .replace(/[*_`#>]/g, '')
      .replace(/\bhttps?:\/\/\S+/g, ' link ')
      .slice(0, 1200);
    const u = new SpeechSynthesisUtterance(clean);
    u.rate = 1.04; u.pitch = 0.92;
    speechSynthesis.speak(u);
  } catch (e) { /* a voice that will not start is not worth an error */ }
}

function toggleVoice() {
  speak = !speak;
  $('voice').classList.toggle('on', speak);
  try { localStorage.setItem(KEY + '_voice', speak ? '1' : '0'); } catch (e) {}
  if (!speak && 'speechSynthesis' in window) speechSynthesis.cancel();
  setState(speak ? 'VOICE ON' : 'STANDING BY', false);
  // Chrome will not speak until a real gesture has happened. Turning the
  // switch on IS that gesture, so an empty utterance here unlocks it and the
  // first real reply is not silently swallowed.
  if (speak && 'speechSynthesis' in window) {
    try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) {}
  }
}

let rec = null;
function listen() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setState('THIS BROWSER HAS NO SPEECH INPUT', false);
    return;
  }
  if (rec) { rec.stop(); return; }
  rec = new SR();
  rec.lang = navigator.language || 'en-US';
  rec.interimResults = true;
  rec.continuous = false;
  $('mic').classList.add('rec');
  setState('LISTENING', true);
  rec.onresult = (e) => {
    let t = '';
    for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
    $('q').value = t;
    grow();
  };
  rec.onerror = (e) => setState('MIC: ' + (e.error || 'failed'), false);
  rec.onend = () => {
    rec = null;
    $('mic').classList.remove('rec');
    setState('STANDING BY', false);
    // Sent on its own. Speaking a question and then having to press a button
    // is two ways of doing one thing.
    if ($('q').value.trim()) ask();
  };
  try { rec.start(); } catch (e) { rec = null; $('mic').classList.remove('rec'); }
}

/* ── Keeping the conversation ─────────────────────────────────────────── */
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(history.slice(-MAX_TURNS * 2))); }
  catch (e) { /* a full or blocked store loses the history, not the page */ }
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const h = JSON.parse(raw);
    if (!Array.isArray(h) || !h.length) return false;
    history = h;
    h.forEach(m => {
      const t = m.parts && m.parts[0] && m.parts[0].text;
      if (t) bubble(m.role === 'user' ? 'me' : 'it', md(t));
    });
    return true;
  } catch (e) { return false; }
}
function wipe() {
  if (history.length && !confirm('Clear this conversation?')) return;
  history = [];
  try { localStorage.removeItem(KEY); } catch (e) {}
  log.innerHTML = '';
  greet();
}

/* ── The room switching on ────────────────────────────────────────────── */
const SEEDS = [
  'What should I get done today?',
  'Explain something I should understand better',
  'Help me write this',
  'Is anything severe happening in the US right now?',
];
function greet() {
  const boot = document.createElement('div');
  boot.className = 'msg it';
  boot.innerHTML =
    '<div class="who">ASTURIO</div><div class="bubble">'
    + '<p class="boot">CORE <b>ONLINE</b></p>'
    + '<p class="boot">LINK <b>ESTABLISHED</b></p>'
    + '<p class="boot">MEMORY <b>' + (history.length ? 'RESTORED' : 'CLEAR') + '</b></p>'
    + '<p style="margin-top:.7em">Ready. Ask me anything, type it or use the mic.</p>'
    + '<div id="seeds"></div></div>';
  log.appendChild(boot);
  const seeds = boot.querySelector('#seeds');
  SEEDS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s;
    b.onclick = () => ask(s);
    seeds.appendChild(b);
  });
  log.scrollTop = log.scrollHeight;
}

/* The box grows with what is typed, up to a point, so a long message is
   visible while being written instead of scrolling inside one line. */
function grow() {
  const q = $('q');
  q.style.height = 'auto';
  q.style.height = Math.min(q.scrollHeight, 168) + 'px';
}
$('q').addEventListener('input', grow);
$('q').addEventListener('keydown', (e) => {
  // Enter sends, shift and enter makes a new line, which is what every chat
  // box does and therefore what the fingers already expect.
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});

try { speak = localStorage.getItem(KEY + '_voice') === '1'; } catch (e) {}
$('voice').classList.toggle('on', speak);
// The boot sequence belongs to an empty room. Printing it under a restored
// conversation would announce the core coming online below three days of
// messages, which reads as the page having lost its place.
if (!load()) greet();
else {
  const back = document.createElement('div');
  back.className = 'msg it';
  back.innerHTML = '<div class="who">ASTURIO</div><div class="bubble">'
    + '<p class="boot">MEMORY <b>RESTORED</b> &middot; '
    + history.length + ' messages</p></div>';
  log.appendChild(back);
  log.scrollTop = log.scrollHeight;
}
$('q').focus();
</script>
</body>
</html>
