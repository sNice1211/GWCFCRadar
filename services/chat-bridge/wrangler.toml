name = "gwcfcradar-chat-bridge"
main = "worker.js"
compatibility_date = "2024-11-01"

# Cloudflare's shortest cron interval is one minute, which is the latency floor
# for a Discord message reaching the map. Messages going the other way do not
# pass through here and are instant.
[triggers]
crons = ["* * * * *"]

[vars]
# Public Firebase web config, the same pair already shipped in index.html.
# These are not secrets: they identify the project, they do not grant access.
FIREBASE_PROJECT_ID = "gwcfc-radar"
FIREBASE_API_KEY = "AIzaSyAAPuBJFlhBFPhqPGlrNnn_c0NZFRgZTI8"

# Set these two with `wrangler secret put`, NOT here - anything in this file is
# committed to the repo:
#   wrangler secret put DISCORD_TOKEN      (bot token, from the Developer Portal)
#   wrangler secret put CHAT_CHANNEL_ID    (right-click channel -> Copy Channel ID)
